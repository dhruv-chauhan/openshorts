name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Everything the collected tests import at module level, WITHOUT the
      # heavy ML stack (torch/ultralytics/mediapipe/faster-whisper) — the
      # pipeline modules import those lazily behind their feature gates, and
      # the tests exercise the gated-off paths. numpy+opencv cover the layout
      # modules, fastapi/boto3/PyJWT/python-multipart cover importing app.py
      # for the MCP endpoint tests, google-genai covers gemini_worker.
      - name: Install test dependencies
        run: >
          pip install pytest pillow httpx pydantic sqlalchemy greenlet numpy
          opencv-python-headless python-dotenv google-genai fastapi boto3
          PyJWT email-validator python-multipart
      - name: Run tests
        # Foundry transport tests use the same pinned SDK as the clip-only worker.
        run: |
          pip install -r requirements-clip-foundry.txt
          pytest tests/ -v

  clip-only-no-google:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install clip-only provider and import-test dependencies
        run: pip install -r requirements-clip-foundry.txt pytest httpx python-dotenv opencv-python-headless pillow tqdm
      - name: Verify no Google SDK and test isolated profile
        run: |
          python -c "from importlib.metadata import distributions; assert 'google-genai' not in {d.metadata['Name'].lower() for d in distributions()}"
          pytest tests/test_clip_pipeline_*.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
