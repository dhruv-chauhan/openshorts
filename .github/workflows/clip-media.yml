name: Clip-only media image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'clip_pipeline/**'
      - 'Dockerfile.clip*'
      - 'requirements-clip-*.txt'
      - 'fonts/**'
      - 'tests/*media_smoke.py'
      - '*.py'
      - '.github/workflows/clip-media.yml'

jobs:
  real-media-no-google:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU media test image with real weights
        run: docker build --platform linux/amd64 -f Dockerfile.clip --target media-test -t clip-media-test .
      - name: Render, reuse transcript, and invalidate changed source offline
        run: |
          mkdir -p output/clip-media-smoke
          docker run --rm --network none --cpus 2 --memory 6g \
            -v "$PWD/output/clip-media-smoke:/data" clip-media-test /data/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clip-media-smoke
          path: |
            output/clip-media-smoke/smoke/smoke-report.json
            output/clip-media-smoke/smoke/stories/story-smoke-report.json
            output/clip-media-smoke/smoke/stories/audit/audit-smoke-report.json
            output/clip-media-smoke/smoke/workspace/runs/**/worker.log
